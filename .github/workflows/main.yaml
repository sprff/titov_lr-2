name: CI
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "hello from CI"
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Test python
        run: python3 -m unittest discover -v
